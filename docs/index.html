<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaBrew — Coffee Taste Profile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1e1410;
      --muted: #9e8470;
      --accent: #9a6b45;
      --line: rgba(90, 63, 43, 0.12);
    }

    body {
      min-height: 100vh;
      font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(150deg, #f9f5ee 0%, #e4d8c6 100%);
      color: var(--ink);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px 60px;
    }

    #app { width: min(720px, 100%); }

    .card {
      background: rgba(255, 253, 249, 0.88);
      border: 1px solid var(--line);
      border-radius: 32px;
      padding: 52px;
      box-shadow:
        0 2px 4px rgba(67,45,28,0.04),
        0 12px 40px rgba(67,45,28,0.07),
        0 40px 100px rgba(67,45,28,0.06);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    /* Intro */
    .intro-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .intro-meta .dim { color: var(--muted); font-weight: 400; }

    .card h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 18px;
    }

    .lead {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.65;
      max-width: 52ch;
      margin-bottom: 36px;
    }

    .intro-stats {
      display: flex;
      gap: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .btn-primary {
      background: var(--ink);
      color: #f9f5ee;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 16px 36px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
      font-family: inherit;
    }

    .btn-primary:hover { background: #3a2318; transform: translateY(-1px); }

    /* Quiz */
    .quiz-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .question-count {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .progress-track {
      flex: 1;
      height: 1px;
      background: var(--line);
      border-radius: 99px;
      margin-left: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #c49060);
      border-radius: 99px;
      transition: width 400ms ease;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin-bottom: 22px;
    }

    .options { display: grid; gap: 10px; }

    .option {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px 24px;
      background: rgba(255,255,255,0.55);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 180ms ease;
      text-align: left;
      width: 100%;
      font-family: inherit;
    }

    .option:hover {
      background: rgba(255,255,255,0.95);
      border-color: rgba(154,107,69,0.28);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(67,45,28,0.09);
    }

    .option-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }

    .option-arrow {
      font-size: 0.9rem;
      color: rgba(154,107,69,0.35);
      flex-shrink: 0;
      margin-left: 20px;
      transition: color 180ms ease, transform 180ms ease;
    }

    .option:hover .option-arrow { color: var(--accent); transform: translateX(3px); }

    /* Result */
    .result-eyebrow {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .result-summary {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .result-copy {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 54ch;
      margin-bottom: 36px;
    }

    .coffee-block {
      border-top: 1px solid var(--line);
      padding-top: 30px;
      margin-bottom: 36px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .coffee-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .coffee-copy {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.65;
      max-width: 50ch;
    }

    .result-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 999px;
      border: 1px solid var(--line);
      cursor: pointer;
      transition: all 180ms ease;
      font-family: inherit;
    }

    .btn-secondary:hover { border-color: rgba(154,107,69,0.3); color: var(--ink); }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #f9f5ee;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      padding: 12px 24px;
      border-radius: 999px;
      pointer-events: none;
      animation: fadeup 1.9s ease forwards;
    }

    @keyframes fadeup {
      0%   { opacity: 0; transform: translateX(-50%) translateY(8px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .fade-in { animation: fadein 300ms ease forwards; }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      body { padding: 20px 14px 48px; }
      .card { padding: 32px 24px; }
      .intro-stats { gap: 20px; }
      .result-actions { flex-direction: column; align-items: stretch; text-align: center; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
var data = {
  personalities: {
    "Bold Explorer": {
      summary: "Adventurous, intense, and drawn to strong points of view.",
      description: "You like a little edge in the experience. Bold Explorer personalities gravitate toward dramatic flavors, memorable moments, and coffees that feel like a story worth chasing. You do not want safe when something unforgettable is on the table.",
      coffee: { name: "Double Down", description: "Extra-bold espresso roast, thick crema, no apologies. The coffee equivalent of committing fully — no hedging, maximum presence in the cup." }
    },
    "Smooth Operator": {
      summary: "Polished, balanced, and effortlessly composed.",
      description: "You value refinement over noise. Smooth Operator personalities prefer a coffee experience that feels considered, elevated, and quietly confident. You are not chasing chaos. You are choosing taste with intention.",
      coffee: { name: "Velvet Fog", description: "Medium-light, creamy mouthfeel, almond and cocoa notes. Refined and polished, never overreaches. Quietly excellent — just like you." }
    },
    "Cozy Classic": {
      summary: "Warm, grounded, and ritual-oriented.",
      description: "You are building a mood as much as a routine. Cozy Classic personalities want coffee that feels reassuring, familiar, and emotionally steady. Comfort is not boring to you. It is a craft.",
      coffee: { name: "Sunday Paper", description: "Medium roast, hazelnut and vanilla, comfort in a cup. Dependable every morning. The name alone does the work." }
    },
    "Wild Card": {
      summary: "Curious, creative, and drawn to the unexpected.",
      description: "You are energized by novelty and beauty that does not look like everyone else's. Wild Card personalities lean toward coffees that feel alive, expressive, and just strange enough to be interesting.",
      coffee: { name: "Off the Map", description: "Experimental processing, funky fruit notes, surprises every time. A rotating micro-lot where unpredictability is the whole point." }
    }
  },
  questions: [
    { prompt: "How do you usually take your coffee?", choices: [
      { text: "Black, no hesitation", type: "Bold Explorer" },
      { text: "A splash of milk, nothing more", type: "Smooth Operator" },
      { text: "Creamy and a little sweet", type: "Cozy Classic" },
      { text: "Whatever the barista recommends today", type: "Wild Card" }
    ]},
    { prompt: "What does your ideal morning look like?", choices: [
      { text: "Up early, moving fast, agenda already set", type: "Bold Explorer" },
      { text: "Unhurried, a good routine, everything in its place", type: "Smooth Operator" },
      { text: "Slow, quiet, no alarm if possible", type: "Cozy Classic" },
      { text: "Depends entirely on the day", type: "Wild Card" }
    ]},
    { prompt: "When you try a new coffee, what are you hoping for?", choices: [
      { text: "Something intense that makes an impression", type: "Bold Explorer" },
      { text: "Balanced and reliable, something I'd order again", type: "Smooth Operator" },
      { text: "Familiar and comforting, like a good habit", type: "Cozy Classic" },
      { text: "Something I've never tasted before", type: "Wild Card" }
    ]},
    { prompt: "How do you make decisions?", choices: [
      { text: "Quickly and confidently", type: "Bold Explorer" },
      { text: "Carefully, with all the information", type: "Smooth Operator" },
      { text: "I trust what has worked before", type: "Cozy Classic" },
      { text: "I go with whatever feels right in the moment", type: "Wild Card" }
    ]},
    { prompt: "Pick the weekend that sounds best.", choices: [
      { text: "A long hike somewhere remote and demanding", type: "Bold Explorer" },
      { text: "A well-planned city trip with great restaurants", type: "Smooth Operator" },
      { text: "A slow day at home with no real agenda", type: "Cozy Classic" },
      { text: "Booking something last-minute and figuring it out", type: "Wild Card" }
    ]},
    { prompt: "What do you look for in a great product?", choices: [
      { text: "It's the best at what it does, no compromises", type: "Bold Explorer" },
      { text: "Consistent quality, every single time", type: "Smooth Operator" },
      { text: "It feels familiar and dependable", type: "Cozy Classic" },
      { text: "It surprises me in some way", type: "Wild Card" }
    ]},
    { prompt: "How do you feel about trying something completely new?", choices: [
      { text: "I seek it out", type: "Bold Explorer" },
      { text: "Only if it comes recommended", type: "Smooth Operator" },
      { text: "I prefer to stick with what I know", type: "Cozy Classic" },
      { text: "New is always better than familiar", type: "Wild Card" }
    ]}
  ]
};

var state = { step: "intro", currentQuestion: 0, answers: [] };
var app = document.getElementById("app");

function computeResult() {
  var counts = {}, lastType = null;
  state.answers.forEach(function(a) {
    counts[a.type] = (counts[a.type] || 0) + 1;
    lastType = a.type;
  });
  var sorted = Object.keys(counts).sort(function(a, b) {
    if (counts[b] !== counts[a]) return counts[b] - counts[a];
    if (a === lastType) return -1;
    if (b === lastType) return 1;
    return 0;
  });
  return sorted[0] || "Smooth Operator";
}

function render() {
  if (state.step === "intro") {
    app.innerHTML = '<div class="card fade-in">' +
      '<div class="intro-meta"><span class="eyebrow">NovaBrew</span><span class="eyebrow dim" style="color:var(--muted);font-weight:400">Coffee Taste Profile</span></div>' +
      '<h1>Find Your Coffee Personality</h1>' +
      '<p class="lead">Seven questions designed to match you with the NovaBrew coffee that fits your energy best. Answer instinctively — this is a premium personality experience, not a survey.</p>' +
      '<div class="intro-stats">' +
        '<div><div class="stat-label">Questions</div><div class="stat-value">Seven</div></div>' +
        '<div><div class="stat-label">Result Format</div><div class="stat-value">Single Result</div></div>' +
        '<div><div class="stat-label">Personalities</div><div class="stat-value">Four Types</div></div>' +
      '</div>' +
      '<button class="btn-primary" onclick="startQuiz()">Begin the Quiz</button>' +
    '</div>';
  } else if (state.step === "quiz") {
    var q = data.questions[state.currentQuestion];
    var pct = ((state.currentQuestion + 1) / data.questions.length * 100).toFixed(1);
    var opts = q.choices.map(function(c, i) {
      return '<button class="option" onclick="answer(' + i + ')">' +
        '<span class="option-text">' + c.text + '</span>' +
        '<span class="option-arrow">→</span>' +
      '</button>';
    }).join("");
    app.innerHTML = '<div class="card fade-in">' +
      '<div class="quiz-meta">' +
        '<div class="question-count">Question ' + (state.currentQuestion + 1) + ' of ' + data.questions.length + '</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<h1>' + q.prompt + '</h1>' +
      '<p class="subtitle">Choose the option that feels most instinctive.</p>' +
      '<div class="divider"></div>' +
      '<div class="options">' + opts + '</div>' +
    '</div>';
  } else {
    var name = computeResult();
    var p = data.personalities[name];
    var shareText = "I got " + name + " on the NovaBrew Coffee Taste Profile. " + p.summary + " My match is " + p.coffee.name + ".";
    app.innerHTML = '<div class="card fade-in">' +
      '<div class="result-eyebrow">Your coffee personality</div>' +
      '<h1>' + name + '</h1>' +
      '<p class="result-summary">' + p.summary + '</p>' +
      '<p class="result-copy">' + p.description + '</p>' +
      '<div class="coffee-block">' +
        '<div class="section-label">Your NovaBrew Match</div>' +
        '<div class="coffee-name">' + p.coffee.name + '</div>' +
        '<p class="coffee-copy">' + p.coffee.description + '</p>' +
      '</div>' +
      '<div class="result-actions">' +
        '<button class="btn-primary" onclick="copyResult(\'' + encodeURIComponent(shareText) + '\')">Copy Result</button>' +
        '<button class="btn-secondary" onclick="retake()">Retake Quiz</button>' +
      '</div>' +
    '</div>';
  }
}

function startQuiz() {
  state.step = "quiz"; state.currentQuestion = 0; state.answers = [];
  render();
}

function answer(i) {
  state.answers.push(data.questions[state.currentQuestion].choices[i]);
  if (state.currentQuestion === data.questions.length - 1) {
    state.step = "result";
  } else {
    state.currentQuestion++;
  }
  render();
}

function retake() { state.step = "intro"; render(); }

function copyResult(encoded) {
  var text = decodeURIComponent(encoded);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { toast("Result copied to clipboard"); }).catch(function() { toast("Copy failed — select the text manually"); });
  } else {
    toast("Copy failed — select the text manually");
  }
}

function toast(msg) {
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 1900);
}

render();
</script>
</body>
</html>
